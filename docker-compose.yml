services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: factlayer
      POSTGRES_PASSWORD: factlayer
      POSTGRES_DB: factlayer
    ports:
      # host 5433 to avoid clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - factlayer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factlayer -d factlayer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factlayer_pgdata:
